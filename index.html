<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameSpot</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- CSS  -->
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
  <!-- ALT + SHIFT + A -->


  <!-- cabeçalho -->
  <header>

    <!-- Logo -->
    <div class="header-logo">
      <a href="#home">
        <img src="img/logo.png" alt="" class="logo">
      </a>
    </div>

    <!-- MENU DESKTOP / PC -->
    <nav class="menu-desktop">
      <ul class="menu">
        <li>

          <a href="#inicio" class="=menu-link active" <span class="menu-texto">inicio</span>
          </a>
        </li>



        <li>
          <a href="#projeto" class="menu-link">
            <span class="menu-texto">projetos</span>
          </a>
        </li>



        <li>
          <a href="#sobre" class="menu-link">
            <span class="menu-texto">sobre</span>
          </a>
        </li>


        <li>
          <a href="#contato" class="menu-link">
            <span class="menu-texto">contato</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- icone trocar cor tema -->
    <div class="header-toggle">
      <!-- Icone sol e lua-->
      <i class="bi bi-sun" id="toggleTheme"> </i>
      <!-- botao hamburguer -->
      <button class="btn-menu-mobile" id="menuHamburger">
        <i class="bi bi-list"></i>
      </button>

    </div>


  </header>
</body>

</html>
